# T-01.1 / T-UX02: add an event from Today with "+ Add", then find it.
# (Late in the evening a new event starts tomorrow, so it's checked through search.)
appId: com.daybloom.app
name: Add an event from Today
---
- runFlow: subflows/start.yaml
- tapOn: "Add"
- tapOn: "Event.*"
- inputText: "Dentist"
- tapOn: "Save"
- tapOn: "Search your plans"
- inputText: "Dentist"
- assertVisible: 'Events \(1\)'
